<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Universe explorer: from the Sun to the cosmic web</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ink:#05060f;--ice:#dff1ff;--dim:#93a6c8;--cyan:#4de1ff;--panel:rgba(10,14,34,.72);--line:rgba(160,200,255,.26);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--ink);color:var(--ice);font-family:'DM Sans',system-ui,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#warp{position:fixed;inset:0;background:radial-gradient(circle,#fff 0,#7fd6ff 25%,#05060f 70%);opacity:0;pointer-events:none}
#top{position:fixed;left:16px;top:calc(env(safe-area-inset-top,0px) + 14px);pointer-events:none}
h1{margin:0;font:700 20px/1.1 'Unbounded',system-ui,sans-serif}
#now{margin:6px 0 0;font-size:14px;color:var(--dim)}
#dock{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);padding:0 12px;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#card{display:none;pointer-events:auto;position:relative;width:min(480px,100%);max-height:38vh;overflow:auto;box-sizing:border-box;padding:12px 44px 12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:14px;line-height:1.4}
#card b{font:500 16px 'Unbounded',sans-serif}
#card em{margin-left:8px;font-style:normal;color:var(--cyan);font-size:13px}
#card p{margin:4px 0 8px;color:var(--dim)}
#cs{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:0}
#cs div{min-width:0}
#cs dt{font-size:12px;color:var(--dim)}
#cs dd{margin:0;font-weight:500}
#cx{position:absolute;top:6px;right:6px;width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:var(--ice);font-size:22px;cursor:pointer}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#hint{margin:0;font-size:13px;color:var(--dim);text-align:center;transition:opacity .6s}
.row{display:flex;gap:8px;overflow-x:auto;max-width:100%;padding:3px;scrollbar-width:none;pointer-events:auto}
.row::-webkit-scrollbar{display:none}
.row button{flex:none;min-height:42px;padding:0 15px;border:1px solid var(--line);border-radius:999px;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--ice);font:500 14px 'DM Sans',sans-serif;cursor:pointer;transition:background .2s,color .2s}
.row button.on{background:var(--ice);color:var(--ink);border-color:var(--ice)}
#levels button{border-color:rgba(77,225,255,.45)}
</style>
</head>
<body>
<div id="stage" aria-label="Interactive 3D universe"></div>
<div id="warp"></div>
<header id="top"><h1>Universe explorer</h1><p id="now"></p></header>
<section id="dock">
  <div id="card" aria-live="polite"><button id="cx" aria-label="Close details">×</button><b id="cn"></b><em id="ck"></em><p id="ci"></p><dl id="cs"></dl></div>
  <p id="hint">Tap any object or star for facts. Drag to look around, pinch or scroll to zoom. Switch scale below. Distances are compressed.</p>
  <nav class="row" id="levels" aria-label="Scale"></nav>
  <nav class="row" id="bar" aria-label="Camera shots"></nav>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const T=THREE,rnd=Math.random,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,sp=reduce?.3:1;
const gauss=()=>(rnd()+rnd()+rnd()-1.5)*.8;
const scene=new T.Scene();scene.background=new T.Color(0x05060f);
const cam=new T.PerspectiveCamera(60,innerWidth/innerHeight,.1,8000);
const ren=new T.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);document.getElementById('stage').appendChild(ren.domElement);
scene.add(new T.AmbientLight(0x2a3a66,.9));

/* helpers */
function glowTex(){const s=128,k=document.createElement('canvas');k.width=k.height=s;const g=k.getContext('2d'),r=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.25,'rgba(255,255,255,.35)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,s,s);return new T.CanvasTexture(k)}
const GL=glowTex();
function dot(par,pos,hex,size){const s=new T.Sprite(new T.SpriteMaterial({map:GL,color:hex,blending:T.AdditiveBlending,transparent:true,depthWrite:false}));s.scale.set(size,size,1);s.position.copy(pos);par.add(s);return s}
function ptex(base,alt,bands){const k=document.createElement('canvas');k.width=128;k.height=64;const g=k.getContext('2d');g.fillStyle=base;g.fillRect(0,0,128,64);g.fillStyle=alt;
  if(bands){for(let y=0;y<64;y+=4){g.globalAlpha=rnd()*.7;g.fillRect(0,y,128,4)}}
  else for(let i=0;i<40;i++){g.globalAlpha=.4+rnd()*.5;g.beginPath();g.ellipse(rnd()*128,rnd()*64,4+rnd()*14,3+rnd()*8,0,0,6.3);g.fill()}
  return new T.CanvasTexture(k)}
function tcol(k){return k<3600?0xff8a5a:k<5000?0xffb870:k<6000?0xffe6b0:k<7600?0xfff4e0:k<11000?0xdfe9ff:0x9fc2ff}
const dirv=(ra,dec)=>{const a=ra*.2618,d=dec*.01745;return new T.Vector3(Math.cos(d)*Math.cos(a),Math.sin(d),-Math.cos(d)*Math.sin(a))};
const fmt=n=>n.toLocaleString('en-US');

/* levels */
const L=[];let cur;
function level(name,R,short){const g=new T.Group();g.visible=false;scene.add(g);
  const pts=[];for(let i=0;i<9;i++){const a=i/9*6.283;pts.push(new T.Vector3(Math.cos(a)*R*.55,Math.sin(i*2.3)*R*.18,Math.sin(a)*R*.55))}
  const lv={name,short,g,R,items:[],spins:[],upd:[],path:new T.CatmullRomCurve3(pts,true),pk:null};L.push(lv);return lv}
function reg(lv,n,c,par,hr,view,desc,stats,pos){const hit=new T.Mesh(new T.SphereGeometry(hr,10,8),new T.MeshBasicMaterial());hit.visible=false;if(pos)hit.position.copy(pos);par.add(hit);const it={n,c,hit,hr,view,desc,stats};lv.items.push(it);return it}
/* procedural, clickable point clouds */
function points(lv,pos,col,size,info,view){const g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(pos,3));g.setAttribute('color',new T.BufferAttribute(col,3));
  const o=new T.Points(g,new T.PointsMaterial({size,sizeAttenuation:false,vertexColors:true}));lv.g.add(o);lv.pk={o,pos,info,view}}

/* 1. Solar system */
const SS=level('Solar system',95,'Solar system');
{const sun=new T.Group();SS.g.add(sun);sun.add(new T.Mesh(new T.SphereGeometry(5,40,28),new T.MeshBasicMaterial({color:0xffd27a})));dot(sun,new T.Vector3(),0xffc070,36);
 SS.g.add(new T.PointLight(0xfff0cc,1.7,0,0));
 reg(SS,'Sun','Star',sun,5.4,16,'Holds 99.86% of all the mass in the solar system.',[['Diameter','1.39 million km'],['Surface','≈5,500 °C'],['Age','≈4.6 billion years'],['Light to Earth','≈8 min 20 s']]);
 const planet=(n,r,a,au,base,alt,bands,ring,desc,stats,tilt)=>{const piv=new T.Group();piv.rotation.z=tilt;SS.g.add(piv);const sg=new T.Group();sg.rotation.y=rnd()*6.28;piv.add(sg);const hold=new T.Group();hold.position.x=a;sg.add(hold);
  const pts=[];for(let i=0;i<=160;i++){const t=i/160*6.2832;pts.push(new T.Vector3(Math.cos(t)*a,0,Math.sin(t)*a))}
  piv.add(new T.LineLoop(new T.BufferGeometry().setFromPoints(pts),new T.LineBasicMaterial({color:0x6f8fd0,transparent:true,opacity:.22})));
  SS.spins.push({g:sg,w:.18/Math.pow(au,.9)});
  const m=new T.Mesh(new T.SphereGeometry(r,36,24),new T.MeshStandardMaterial({map:ptex(base,alt,bands),roughness:.8,emissive:new T.Color(base),emissiveIntensity:.07}));hold.add(m);
  if(ring){const rg=new T.Mesh(new T.RingGeometry(r*1.4,r*2.4,80),new T.MeshBasicMaterial({color:0xd8c08a,transparent:true,opacity:.6,side:T.DoubleSide}));rg.rotation.x=-Math.PI/2.2;m.add(rg)}
  SS.upd.push(dt=>m.rotation.y+=dt*.4);return reg(SS,n,'Planet',m,r*1.2+.2,r*4.5,desc,stats)};
 planet('Mercury',.5,8,.39,'#8c8680','#5d5853',0,0,'The smallest planet and the closest to the Sun.',[['Diameter','4,879 km'],['Distance','0.39 AU'],['Year','88 days'],['Moons','0']],.05);
 planet('Venus',.9,12,.72,'#d9b36a','#f1d9a0',1,0,'The hottest planet. A thick CO₂ atmosphere traps heat, and it spins backwards.',[['Diameter','12,104 km'],['Distance','0.72 AU'],['Year','225 days'],['Surface','≈465 °C']],-.06);
 const E=planet('Earth',1,17,1,'#1d5fa8','#3f9a55',0,0,'The only place known to host life.',[['Diameter','12,742 km'],['Distance','1 AU (≈150 million km)'],['Year','365.25 days'],['Moons','1']],0);
 {const p=new T.Group();E.hit.parent.parent.add(p);const m=new T.Mesh(new T.SphereGeometry(.27,20,14),new T.MeshStandardMaterial({map:ptex('#a6a6a6','#6e6e6e'),roughness:.9}));m.position.x=3.4;p.add(m);SS.spins.push({g:p,w:.5});
  reg(SS,'Moon','Moon',m,.6,1.6,'Earth’s only natural satellite. It always shows the same face to us.',[['Diameter','3,474 km'],['Distance','384,400 km'],['Orbit','27.3 days'],['First crewed landing','1969']])}
 planet('Mars',.7,22,1.52,'#b5532f','#7a3320',0,0,'Cold and dusty, home to Olympus Mons, the tallest volcano known in the solar system.',[['Diameter','6,779 km'],['Distance','1.52 AU'],['Year','687 days'],['Moons','2']],.04);
 planet('Jupiter',3,40,5.2,'#c9a27a','#8f6a4c',1,0,'The largest planet. Its Great Red Spot is a storm wider than Earth.',[['Diameter','139,820 km'],['Distance','5.2 AU'],['Year','11.9 years'],['Moons','more than 90']],-.03);
 planet('Saturn',2.5,52,9.54,'#d8c08a','#b79a62',1,1,'Famous for rings made mostly of water ice. It is less dense than water.',[['Diameter','116,460 km'],['Distance','9.54 AU'],['Year','29.4 years'],['Moons','over 140']],.05);
 planet('Uranus',1.6,63,19.2,'#8fd8e0','#6bbcc8',1,0,'An ice giant that rolls around the Sun tilted about 98°.',[['Diameter','50,724 km'],['Distance','19.2 AU'],['Year','84 years'],['Moons','over two dozen']],-.04);
 planet('Neptune',1.5,73,30.1,'#3a5fd9','#2a43a8',1,0,'The windiest planet, with gusts above 2,000 km/h. Only Voyager 2 has visited.',[['Diameter','49,244 km'],['Distance','30.1 AU'],['Year','165 years'],['Moons','about 16']],.03);
 const n=500,pos=new Float32Array(n*3),col=new Float32Array(n*3);for(let i=0;i<n;i++){const a=rnd()*6.28,r=26+rnd()*6;pos.set([Math.cos(a)*r,(rnd()-.5)*2,Math.sin(a)*r],i*3);col.set([.6,.65,.75],i*3)}
 points(SS,pos,col,2,i=>({n:'Asteroid '+(i+1),c:'Asteroid (illustrative)',desc:'A generated rock in the main belt between Mars and Jupiter. Real asteroids number in the millions.',stats:[['Belt distance','2.2–3.2 AU'],['Real entry?','No, generated']]}),3)}

/* 2. Nearby stars */
const NS=level('Nearby stars',230,'Nearby stars');
{const S=[['Proxima Centauri',14.5,-62.68,4.24,'M5.5V',3050,2.4,'Centaurus','The closest known star to the Sun, a small red dwarf with at least one planet, Proxima b.'],
['Alpha Centauri',14.66,-60.83,4.37,'G2V + K1V',5790,3.6,'Centaurus','A triple system. Alpha Cen A and B are Sun-like, and Proxima is the third member.'],
['Barnard’s Star',17.96,4.69,5.96,'M4V',3200,2.4,'Ophiuchus','A faint red dwarf with the fastest apparent motion across our sky of any known star.'],
['Sirius',6.75,-16.72,8.6,'A1V',9940,5,'Canis Major','The brightest star in the night sky, with a white-dwarf companion.'],
['Epsilon Eridani',3.55,-9.46,10.5,'K2V',5080,2.8,'Eridanus','A young orange dwarf with a dusty debris disk and a Jupiter-like planet.'],
['Procyon',7.65,5.22,11.5,'F5IV–V',6530,3.8,'Canis Minor','A bright yellow-white star with a white-dwarf companion.'],
['Tau Ceti',1.73,-15.94,11.9,'G8V',5340,2.8,'Cetus','A Sun-like star long targeted in the search for life, with several candidate planets.'],
['Altair',19.85,8.87,16.7,'A7V',7700,3.8,'Aquila','Spins once in about 9 hours, so it is flattened at the poles.'],
['Vega',18.62,38.78,25,'A0V',9600,4.4,'Lyra','The first star other than the Sun to be photographed (1850), and a long-time brightness standard.'],
['Fomalhaut',22.96,-29.62,25,'A3V',8590,4,'Piscis Austrinus','Surrounded by a large ring of dust and debris imaged by Hubble.'],
['Arcturus',14.26,19.18,37,'K1.5III',4290,5,'Boötes','An orange giant, the brightest star in the northern sky.'],
['Pollux',7.76,28.03,34,'K0III',4660,4,'Gemini','An orange giant, the brighter of the Gemini twins, with a confirmed planet.'],
['Aldebaran',4.6,16.51,65,'K5III',3900,5,'Taurus','The orange eye of Taurus, a red-giant star.'],
['Regulus',10.14,11.97,79,'B8IV',12460,4,'Leo','Spins so fast it is flattened, and is part of a multiple system.'],
['Spica',13.42,-11.16,250,'B1III–IV + B2V',22000,4.8,'Virgo','A close pair of hot blue stars that stretch each other into egg shapes.'],
['Canopus',6.4,-52.7,310,'A9II',7400,5.4,'Carina','The second-brightest star in the night sky.'],
['Polaris',2.53,89.26,433,'F7Ib',6000,4,'Ursa Minor','The North Star, a pulsating Cepheid sitting almost above Earth’s north pole.'],
['Antares',16.49,-26.43,550,'M1.5Iab',3400,6,'Scorpius','A red supergiant, the heart of Scorpius, roughly 700 times the Sun’s width.'],
['Betelgeuse',5.92,7.41,'≈550–700','M1–2Ia–Iab',3500,6.6,'Orion','A red supergiant that will one day end as a supernova.'],
['Rigel',5.24,-8.2,860,'B8Ia',12100,6,'Orion','A blue supergiant shining with more than 100,000 times the Sun’s light.'],
['Deneb',20.69,45.28,2600,'A2Ia',8500,7,'Cygnus','A blue-white supergiant at the tail of Cygnus, among the most luminous stars visible to the eye.'],
['VY Canis Majoris',7.38,-25.77,3900,'M3–4 hypergiant',3500,7,'Canis Major','A red hypergiant, among the largest stars known.'],
['Eta Carinae',10.75,-59.68,7500,'Luminous blue variable binary',null,8,'Carina','A massive, unstable binary that erupted in the 1840s, creating the Homunculus Nebula.'],
['TRAPPIST-1',23.11,-5.04,40.7,'M8V',2566,2.2,'Aquarius','An ultracool dwarf with seven Earth-size planets, at least three possibly in the habitable zone.']];
 const o=new T.Vector3();dot(NS.g,o,0xffe6b0,5);reg(NS,'Our Sun','Star',NS.g,3,18,'The centre of this map. Every distance here is measured from our own star.',[['Spectral class','G2V'],['Temperature','5,772 K'],['Distance','0 ly']],o);
 S.forEach(s=>{const d=typeof s[3]==='number'?s[3]:600,p=dirv(s[1],s[2]).multiplyScalar(16*Math.pow(d,.33));dot(NS.g,p,tcol(s[5]||30000),s[6]*3.2);
  reg(NS,s[0],'Star',NS.g,Math.max(s[6]*.9,2.2),22,s[8],[['Distance',(typeof s[3]==='number'?fmt(s[3]):s[3])+' light-years'],['Spectral class',s[4]],['Temperature',s[5]?fmt(s[5])+' K':'Variable'],['Constellation',s[7]]],p)});
 const CL=[['O or B','Blue-white','10,000–30,000 K',[.62,.76,1]],['A','White','7,500–10,000 K',[.87,.91,1]],['F or G','Yellow-white','5,200–7,500 K',[1,.95,.82]],['K','Orange','3,900–5,200 K',[1,.72,.44]],['M','Red','2,400–3,900 K',[1,.54,.35]]];
 const n=1500,pos=new Float32Array(n*3),col=new Float32Array(n*3),ty=new Uint8Array(n);
 for(let i=0;i<n;i++){const r=rnd(),k=r<.03?0:r<.08?1:r<.2?2:r<.4?3:4,v=new T.Vector3(gauss(),gauss(),gauss()).normalize().multiplyScalar(60+rnd()*270);ty[i]=k;pos.set([v.x,v.y*.8,v.z],i*3);col.set(CL[k][3],i*3)}
 points(NS,pos,col,2.2,i=>{const c=CL[ty[i]];return{n:'Star #'+(i+1),c:'Star (illustrative)',desc:'A generated background star. Most real stars are small, dim red dwarfs.',stats:[['Spectral class',c[0]],['Colour',c[1]],['Temperature',c[2]],['Real entry?','No, generated']]}},12)}

/* 3. Exoplanets */
const EX=level('Exoplanets',70,'Exoplanets');
{EX.g.add(new T.DirectionalLight(0xfff4e0,1.6).translateX(40).translateY(30));
 const X=[['Proxima b','#9a6a4a','#6d4630',0,1.2,'Orbits the nearest star in the habitable zone.','Discovered 2016',[['Distance','4.24 ly'],['Minimum mass','≈1.07 Earths'],['Year','11.2 days'],['Host','Proxima Centauri']]],
['TRAPPIST-1 e','#4f7fa8','#3b6a52',0,1.1,'One of seven rocky planets packed around a dwarf star, and a prime target for JWST.','Discovered 2017',[['Distance','40.7 ly'],['Radius','≈0.92 Earth'],['Year','6.1 days'],['Host','TRAPPIST-1']]],
['Kepler-452 b','#6b8f5a','#8a8f6a',0,1.7,'A larger cousin of Earth around a Sun-like star, with a year close to ours.','Discovered 2015',[['Distance','≈1,800 ly'],['Radius','≈1.6 Earths'],['Year','385 days'],['Host','Kepler-452']]],
['51 Pegasi b','#d9a86a','#b07a42',1,2.7,'The first planet found around a Sun-like star, a discovery recognised with the 2019 Nobel Prize.','Discovered 1995',[['Distance','≈50 ly'],['Minimum mass','≈0.47 Jupiters'],['Year','4.2 days'],['Type','Hot Jupiter']]],
['HD 209458 b','#c9b08a','#9a8560',1,2.8,'The first transiting planet found, and the first with an atmosphere detected.','Discovered 1999',[['Distance','≈159 ly'],['Year','3.5 days'],['Type','Hot Jupiter']]],
['55 Cancri e','#d94a2a','#ff9a3a',0,1.6,'A super-Earth so close to its star that its year lasts under a day.','Discovered 2004',[['Distance','≈41 ly'],['Radius','≈1.9 Earths'],['Year','≈18 hours'],['Surface','Hot enough to be molten']]],
['Kepler-186 f','#7a8f6a','#4a6a8a',0,1.2,'The first Earth-size planet found in the habitable zone of another star.','Discovered 2014',[['Distance','≈580 ly'],['Radius','≈1.17 Earths'],['Year','130 days'],['Host','Kepler-186']]],
['TOI-700 d','#5f8fb8','#7f9f6a',0,1.1,'An Earth-size habitable-zone planet found by NASA’s TESS.','Discovered 2020',[['Distance','≈100 ly'],['Radius','≈1.07 Earths'],['Year','37 days'],['Host','TOI-700']]],
['WASP-12 b','#3a2a2a','#7a2a1a',1,3,'A hot Jupiter stretched into an egg shape and slowly spiralling into its star.','Discovered 2008',[['Distance','≈1,400 ly'],['Year','1.1 days'],['Type','Hot Jupiter']]],
['K2-18 b','#6a8fd0','#9fbfe0',1,1.9,'A sub-Neptune where JWST found carbon-bearing molecules in the atmosphere.','Discovered 2015',[['Distance','≈124 ly'],['Radius','≈2.6 Earths'],['Year','33 days'],['Type','Sub-Neptune']]],
['HD 189733 b','#2a4fd9','#1a2f9a',1,2.6,'A blue hot Jupiter with measured winds of around 8,700 km/h.','Discovered 2005',[['Distance','≈64 ly'],['Year','2.2 days'],['Type','Hot Jupiter']]]];
 X.forEach((x,i)=>{const a=i/X.length*6.283,m=new T.Mesh(new T.SphereGeometry(x[4],32,22),new T.MeshStandardMaterial({map:ptex(x[1],x[2],x[3]),roughness:.8,emissive:new T.Color(x[1]),emissiveIntensity:.1}));m.position.set(Math.cos(a)*30,0,Math.sin(a)*30);EX.g.add(m);
  const p0=m.position.y;EX.upd.push(dt=>{m.rotation.y+=dt*.3;m.position.y=Math.sin(performance.now()*.001*sp+i)*1.2});
  reg(EX,x[0],'Exoplanet',m,x[4]*1.25,x[4]*4.5,x[5],[['Found',x[6].replace('Discovered ','')]].concat(x[7]))});
 const n=400,pos=new Float32Array(n*3),col=new Float32Array(n*3);for(let i=0;i<n;i++){const v=new T.Vector3(gauss(),gauss(),gauss()).normalize().multiplyScalar(60+rnd()*60);pos.set([v.x,v.y,v.z],i*3);col.set([.8,.85,1],i*3)}
 points(EX,pos,col,1.6,i=>({n:'Star #'+(i+1),c:'Star (illustrative)',desc:'A generated background star. Thousands of confirmed exoplanets orbit real stars like it.',stats:[['Real entry?','No, generated']]}),8)}

/* 4. Milky Way */
const MW=level('Milky Way',150,'Milky Way');
{const n=9000,pos=new Float32Array(n*3),col=new Float32Array(n*3);
 for(let i=0;i<n;i++){let x,y,z,r;if(rnd()<.22){r=Math.abs(gauss())*10;const a=rnd()*6.283;x=Math.cos(a)*r;z=Math.sin(a)*r;y=gauss()*5}else{r=6+Math.pow(rnd(),.8)*94;const a=Math.floor(rnd()*4)*1.5708+2.75*Math.log(r/6)+gauss()*(.25+r/260);x=Math.cos(a)*r;z=Math.sin(a)*r;y=gauss()*(1.6+r*.01)}

const clock=new T.Clock(),P=new T.Vector3(),Q=new T.Vector3(),wp=new T.Vector3();
function frame(){

  if(tour){tt+=dt;if(tt>7){tt=0;ti=(ti+1)%seq.length;apply(seq[ti])}}
  cur.spins.forEach(s=>s.g.rotation.y+=dt*s.w*sp);cur.upd.forEach(f=>f(dt*sp));
